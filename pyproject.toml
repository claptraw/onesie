[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onesie-navidrome"
version = "0.1a1"
description = "Safely turn Navidrome ratings into delayed, auditable deletion requests."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["navidrome", "subsonic", "music", "beets", "apprise", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
notifications = ["apprise>=1.9"]
test = ["pytest>=8"]
build = ["build>=1.2"]
all = ["apprise>=1.9"]

[project.urls]
Homepage = "https://github.com/claptraw/onesie"
Repository = "https://github.com/claptraw/onesie"
Issues = "https://github.com/claptraw/onesie/issues"
Changelog = "https://github.com/claptraw/onesie/blob/main/CHANGELOG.md"

[project.scripts]
onesie = "onesie_navidrome.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
